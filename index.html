<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#071116">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./grasshopper-app-icon-512.png">
<title>GRASSHOPPER SHOOTING TEST</title>
<style>
:root{--bg:#071116;--panel:#101e25;--panel2:#142630;--line:#29404b;--text:#f4f8fa;--muted:#9db0ba;--lime:#b8f33b;--blue:#48b9e8;--gold:#ffd34e;--purple:#c39bff;--red:#ff7777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans JP",sans-serif}
header{padding:17px 16px 12px;background:#050c10;border-bottom:1px solid var(--line)}
.brand{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:clamp(30px,7vw,42px);font-style:italic;font-weight:900;letter-spacing:1px;line-height:.95;text-transform:uppercase;text-shadow:2px 2px 0 #000}.brand .grass{color:#fff}.brand .hopper{color:var(--lime);margin-left:7px}.brand-sub{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:clamp(22px,5vw,30px);font-style:italic;font-weight:900;letter-spacing:3px;color:#fff;line-height:1.05;margin-top:5px}header small{display:block;color:#d0d9de;font-size:9px;letter-spacing:2.5px;margin-top:8px}
nav{display:flex;overflow-x:auto;gap:4px;padding:8px;background:#0b171d;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
nav button{flex:1;min-width:max-content;border:0;background:transparent;color:#b6c4cb;padding:12px 10px;font-weight:bold;border-bottom:3px solid transparent}
nav button.active{color:#fff;border-color:var(--lime)}
main{max-width:1050px;margin:auto;padding:12px}.tab{display:none}.tab.active{display:block}
.card{background:linear-gradient(145deg,var(--panel),#0c1920);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 12px}h3{font-size:14px;margin:12px 0 8px;color:#dbe6eb}
.small{font-size:12px;color:var(--muted);line-height:1.6}.muted{color:var(--muted)}
button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}
.btn{border:0;border-radius:9px;padding:12px 14px;font-weight:bold}.primary{background:var(--lime);color:#10170a}.secondary{background:#263943;color:#f3f7f9;border:1px solid #3a515c}.danger{background:#4b2529;color:#ffdede;border:1px solid #79434a}
input,select{width:100%;min-width:0;background:#09151b;color:var(--text);border:1px solid #38505c;border-radius:8px;padding:11px;font-size:16px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}.row .fixed{flex:0 0 auto}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{background:#0a171d;border:1px solid #29434f;border-radius:10px;padding:12px}.stat label{display:block;color:#b7c7ce;font-size:12px}.stat strong{display:block;color:var(--lime);font-size:27px;margin:4px 0}.stat small{color:var(--muted);font-size:11px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{padding:10px 8px;border-bottom:1px solid #263d48;text-align:right}th{background:#142630;color:#b9cbd3;font-size:11px}th:first-child,td:first-child{text-align:left}.table-wrap{overflow-x:auto}
.rate{font-weight:bold;color:var(--lime)}.rank{width:42px;color:#d9e4e9}.date-label{font-size:13px;color:#d3e0e5}
.position-strip{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.position-strip button{flex:0 0 auto;background:#1a2d37;color:#dce8ed;border:1px solid #38505c;border-radius:8px;padding:9px 12px;font-size:12px}.position-strip button.active{background:var(--lime);color:#10170a;border-color:var(--lime);font-weight:bold}
.progress{height:6px;background:#233741;border-radius:9px;overflow:hidden;margin:10px 0}.progress div{height:100%;background:var(--lime);width:0}
.player-inputs{display:grid;gap:7px}.player-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 70px;gap:7px;align-items:center;background:#0b181e;border:1px solid #263d48;border-radius:9px;padding:7px}.player-row.done{border-color:#6c9630;background:#142219}.player-row input{text-align:center;font-weight:bold;padding:10px 4px}.player-row .rate-text{text-align:right;font-size:12px;color:#b4c3ca}
.actions{display:flex;gap:8px;margin-top:10px}.actions>*{flex:1}.wide{width:100%;margin-top:12px}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.calendar-head button{background:transparent;color:var(--text);border:0;font-size:24px;padding:4px 12px}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.weekday{text-align:center;color:#9fb4bf;font-size:11px;padding:5px 0}.day{border:0;background:transparent;color:#eaf1f4;min-height:38px;border-radius:50%;position:relative;font-size:14px}.day.other{color:#60727c}.day.has-record:after{content:"";position:absolute;width:5px;height:5px;background:var(--lime);border-radius:50%;bottom:2px;left:calc(50% - 2px)}.day.selected{background:var(--lime);color:#10170a;font-weight:bold}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--muted);margin-top:8px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.legend-row{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 12px;font-size:12px;color:#d7e2e7}.legend-item{display:flex;align-items:center;gap:6px}.swatch{width:10px;height:10px;border-radius:3px;display:inline-block}
canvas{width:100%;height:230px;background:#09161c;border:1px solid #263e49;border-radius:10px}
.modal-bg{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{max-width:480px;width:100%;background:#10212a;border:1px solid #45606c;border-radius:15px;padding:18px}.hidden{display:none!important}
.player-select{display:flex;gap:8px;align-items:center}.player-select select{flex:1}.error{border-color:var(--red)!important;color:var(--red)!important}
.date-list{display:grid;gap:8px}.date-item{display:flex;align-items:center;gap:8px;background:#0b181e;border:1px solid #263d48;border-radius:9px;padding:10px}.date-item .date-info{flex:1}.date-item strong{display:block}.date-item small{color:var(--muted)}
@media(min-width:700px){.stat-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.player-inputs{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="brand"><span class="grass">GRASS</span><span class="hopper">HOPPER</span></div><div class="brand-sub">SHOOTING TEST</div><small>ALL IN · PLAYER DEVELOPMENT</small></header>
<nav>
<button class="active" data-tab="input">データ入力</button>
<button data-tab="results">結果・ランキング</button>
<button data-tab="individual">個人データ</button>
<button data-tab="records">記録管理</button>
<button data-tab="settings">設定・選手</button>
</nav>
<main>
<section id="input" class="tab active">
 <div class="card">
  <div class="row"><div><label class="small">実施日</label><input type="date" id="testDate"></div><div><label class="small">種目</label><select id="kind"><option value="middle">ミドル</option><option value="long">ロング</option><option value="ft">フリースロー</option></select></div></div>
  <div class="position-strip" id="positionStrip"></div>
  <h2 id="positionTitle">ミドル・左0°</h2><span class="small" id="positionCount"></span>
  <div class="progress"><div id="progressBar"></div></div><div class="small" id="progressText"></div>
  <div class="player-inputs" id="playerInputs"></div>
  <div class="actions"><button class="btn secondary" id="prevPos">← 前の位置</button><button class="btn primary" id="nextPos">次の位置 →</button></div>
  <button class="btn primary wide" id="endTest">この日のCSVを保存</button>
  <p class="small">成功本数を入力すると、その場で保存・集計されます。空欄に戻すとその選手の該当位置の記録を削除します。</p>
 </div>
 <div class="card"><h2>LIVE RESULTS · TEAM</h2><div class="stat-grid">
  <div class="stat"><label>ミドル成功率</label><strong id="liveMiddle">--</strong><small id="liveMiddleCount">0 / 0本</small></div>
  <div class="stat"><label>ロング成功率</label><strong id="liveLong">--</strong><small id="liveLongCount">0 / 0本</small></div>
  <div class="stat"><label>トータル成功率</label><strong id="liveTotal">--</strong><small id="liveTotalCount">0 / 0本</small></div>
  <div class="stat"><label>フリースロー成功率</label><strong id="liveFt">--</strong><small id="liveFtCount">0 / 0本</small></div>
 </div><p class="small" id="saveStatus">入力データは端末内に自動保存されます。</p></div>
</section>
<section id="results" class="tab">
 <div class="card"><h2>実施日を選択</h2><div id="resultsCalendar"></div></div>
 <div class="card"><div class="row"><h2 style="margin:0">TEAM RESULT</h2><span class="date-label" id="resultsDateLabel"></span></div><p class="small">チーム全員の成功本数 ÷ チーム全員の試投数</p>
  <div class="stat-grid">
   <div class="stat"><label>ミドル成功率</label><strong id="teamMiddle">--</strong><small id="teamMiddleCount"></small></div>
   <div class="stat"><label>ロング成功率</label><strong id="teamLong">--</strong><small id="teamLongCount"></small></div>
   <div class="stat"><label>トータル成功率</label><strong id="teamTotal">--</strong><small id="teamTotalCount"></small></div>
   <div class="stat"><label>フリースロー成功率</label><strong id="teamFt">--</strong><small id="teamFtCount"></small></div>
  </div><p class="small" id="previousCompare"></p>
 </div>
 <div class="card"><div class="row"><h2 style="margin:0">個人ランキング</h2><select id="rankType"><option value="total">トータル</option><option value="middle">ミドル</option><option value="long">ロング</option><option value="ft">フリースロー</option></select></div>
  <div class="table-wrap"><table><thead><tr><th>順位</th><th>選手</th><th>成功本数</th><th>試投数</th><th>成功率</th></tr></thead><tbody id="ranking"></tbody></table></div>
  <button class="btn primary wide" id="exportDay">選択日のCSVを出力</button>
 </div>
</section>
<section id="individual" class="tab">
 <div class="card"><h2>PLAYER DEVELOPMENT</h2><select id="individualPla
